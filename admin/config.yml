backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: 'Create {{collection}} "{{slug}}"'
    update: 'Update {{collection}} "{{slug}}"'
    delete: 'Delete {{collection}} "{{slug}}"'
    uploadMedia: '[skip ci] Upload "{{path}}"'
    deleteMedia: '[skip ci] Delete "{{path}}"'

media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"
publish_mode: simple

collections:

  - name: "settings"
    label: "网站设置 / Site Settings"
    files:
      - name: "site"
        label: "全站内容 / Site Content"
        file: "data/site.json"
        fields:
          - label: "公司信息 / Company"
            name: "company"
            widget: object
            fields:
              - {label: "中文名", name: "name_zh", widget: "string"}
              - {label: "英文名", name: "name_en", widget: "string"}
              - {label: "品牌", name: "brand", widget: "string"}
              - {label: "中文口号", name: "slogan_zh", widget: "string"}
              - {label: "英文口号", name: "slogan_en", widget: "string"}
              - {label: "成立年份", name: "founded", widget: "string"}
              - {label: "员工数", name: "employees", widget: "string"}
              - {label: "厂房面积", name: "area_sqm", widget: "string"}
              - label: "公司地址 / Address"
                name: "address"
                widget: object
                collapsed: true
                fields:
